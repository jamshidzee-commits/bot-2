name: Uzum probe
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: uzum-probe
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - env:
          UZUM_API_KEY: ${{ secrets.UZUM_API_KEY }}
        run: python uzum_probe.py
      - run: |
          git config user.name shop-bot; git config user.email bot@users.noreply.github.com
          git add uzum_probe.txt; git commit -q -m "uzum probe" || exit 0
          git pull -q --rebase --autostash -X theirs; git push -q
